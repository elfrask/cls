[package]
name = "clx"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clx"
path = "src/main.rs"

[dependencies]
cls-core = { workspace = true }
cls-runtime = { workspace = true }
ureq = "2"
serde_json = "1"
zip = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tower-lsp = "0.20"
